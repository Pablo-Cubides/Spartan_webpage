name: Supabase Keep Alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  # Run manually from Actions tab
  workflow_dispatch:
  # Run on push to main to verify immediately and show in Actions
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-keepalive.yml'

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install pg

      - name: Run Keep-Alive Script
        env:
          # Prefer database connection as we have these credentials
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
          const { Client } = require('pg');
          
          async function ping() {
            const connectionString = process.env.DATABASE_URL;
            if (!connectionString) {
              console.error('❌ Error: Missing DATABASE_URL environment variable');
              process.exit(1);
            }

            console.log('Connecting to database...');
            const client = new Client({
              connectionString: connectionString,
              ssl: { rejectUnauthorized: false }
            });

            try {
              await client.connect();
              const res = await client.query('SELECT NOW() as now');
              console.log('✅ Supabase keep-alive success');
              console.log('Database time:', res.rows[0].now);
              await client.end();
            } catch (err) {
              console.error('❌ Error pinging database:', err);
              process.exit(1);
            }
          }

          ping();
          "
