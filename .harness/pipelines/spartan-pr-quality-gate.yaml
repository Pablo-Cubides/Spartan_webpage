pipeline:
  name: Spartan PR Quality Gate
  identifier: spartan_pr_quality_gate
  orgIdentifier: <+pipeline.variables.org>
  projectIdentifier: <+pipeline.variables.project>
  tags:
    sdd: "true"
    adoption: parallel-first
  variables:
    - name: org
      type: String
      default: default
      description: Harness org identifier
      value: <+input>
    - name: project
      type: String
      default: Spartan
      description: Harness project identifier
      value: <+input>
    - name: git_connector
      type: String
      default: github_spartan
      description: GitHub connector identifier (see harness-setup.md)
      value: <+input>
    - name: repo
      type: String
      default: Pablo-Cubides/Spartan_webpage
      description: GitHub repo (owner/name)
      value: <+input>
    - name: api_url
      type: String
      default: https://spartan-club.vercel.app
      description: Public API URL injected at build time
      value: <+input>
  properties:
    ci:
      codebase:
        connectorRef: <+pipeline.variables.git_connector>
        repoName: <+pipeline.variables.repo>
        build: <+input>
  stages:
    - stage:
        name: Install
        identifier: install
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          infrastructure:
            type: HostedVm
            spec:
              type: harness
              poolName: linux-amd64
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Install root dependencies
                  identifier: install_root
                  spec:
                    shell: Sh
                    image: node:24
                    command: npm ci
              - step:
                  type: Run
                  name: Install frontend dependencies
                  identifier: install_frontend
                  spec:
                    shell: Sh
                    image: node:24
                    command: npm --prefix frontend ci
    - stage:
        name: SDD Gate
        identifier: sdd_gate
        type: CI
        spec:
          cloneCodebase: false
          caching:
            enabled: true
          infrastructure:
            type: HostedVm
            spec:
              type: harness
              poolName: linux-amd64
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Structure
                  identifier: spec_structure
                  spec:
                    shell: Sh
                    image: node:24
                    command: node scripts/qa-spec-structure.js --strict
              - step:
                  type: Run
                  name: Artifacts
                  identifier: spec_artifacts
                  spec:
                    shell: Sh
                    image: node:24
                    command: node scripts/qa-spec-artifacts.js --strict
              - step:
                  type: Run
                  name: API Contracts
                  identifier: spec_completeness
                  spec:
                    shell: Sh
                    image: node:24
                    command: node scripts/qa-spec-completeness.js --strict
              - step:
                  type: Run
                  name: File Traceability
                  identifier: spec_traceability
                  spec:
                    shell: Sh
                    image: node:24
                    command: node scripts/qa-spec-traceability.js --strict
              - step:
                  type: Run
                  name: Acceptance Test Traceability
                  identifier: spec_verify
                  spec:
                    shell: Sh
                    image: node:24
                    command: node scripts/qa-spec-verifier.js --strict
    - stage:
        name: Quality
        identifier: quality
        type: CI
        spec:
          cloneCodebase: false
          caching:
            enabled: true
          infrastructure:
            type: HostedVm
            spec:
              type: harness
              poolName: linux-amd64
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Lint
                  identifier: lint
                  spec:
                    shell: Sh
                    image: node:24
                    command: npm --prefix frontend run lint
              - step:
                  type: Run
                  name: Typecheck
                  identifier: typecheck
                  spec:
                    shell: Sh
                    image: node:24
                    command: npm --prefix frontend run type-check
              - step:
                  type: Run
                  name: Tests
                  identifier: tests
                  spec:
                    shell: Sh
                    image: node:24
                    command: npm --prefix frontend run test
              - step:
                  type: Run
                  name: Prisma validate
                  identifier: prisma_validate
                  spec:
                    shell: Sh
                    image: node:24
                    command: npm --prefix frontend run prisma:validate
    - stage:
        name: Security
        identifier: security
        type: CI
        spec:
          cloneCodebase: false
          caching:
            enabled: true
          infrastructure:
            type: HostedVm
            spec:
              type: harness
              poolName: linux-amd64
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Secret scan (HEAD)
                  identifier: secret_scan
                  spec:
                    shell: Sh
                    image: node:24
                    command: node scripts/scan-secrets.js
              - step:
                  type: Run
                  name: Gitleaks (full history)
                  identifier: gitleaks
                  spec:
                    shell: Sh
                    image: zricethezav/gitleaks:v8.18.4
                    command: |
                      gitleaks detect --source=. --redact --no-git=false --verbose
              - step:
                  type: Run
                  name: Dependency audit (npm)
                  identifier: dependency_audit
                  spec:
                    shell: Sh
                    image: node:24
                    envVariables:
                      STRICT_SECURITY_AUDIT: "1"
                    command: node scripts/security-audit.js --strict
              - step:
                  type: Run
                  name: OWASP Dependency-Check
                  identifier: owasp_dep_check
                  spec:
                    shell: Sh
                    image: owasp/dependency-check:latest
                    command: |
                      /usr/share/dependency-check/bin/dependency-check.sh \
                        --project "spartan-club" \
                        --scan "frontend/package-lock.json" \
                        --format "JSON" \
                        --out "/tmp/depcheck-report.json" \
                        --failOnCVSS 7 \
                        --enableRetired
    - stage:
        name: Build
        identifier: build
        type: CI
        spec:
          cloneCodebase: false
          caching:
            enabled: true
          infrastructure:
            type: HostedVm
            spec:
              type: harness
              poolName: linux-amd64
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Next build
                  identifier: next_build
                  spec:
                    shell: Sh
                    image: node:24
                    envVariables:
                      SKIP_ENV_VALIDATION: "1"
                      NEXT_PUBLIC_API_URL: <+pipeline.variables.api_url>
                      NEXT_PUBLIC_APP_NAME: Spartan Club
                      NEXT_PUBLIC_FIREBASE_API_KEY: <+secrets.getValue("NEXT_PUBLIC_FIREBASE_API_KEY")>
                      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: <+secrets.getValue("NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN")>
                      NEXT_PUBLIC_FIREBASE_PROJECT_ID: <+secrets.getValue("NEXT_PUBLIC_FIREBASE_PROJECT_ID")>
                      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: <+secrets.getValue("NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET")>
                      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: <+secrets.getValue("NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID")>
                      NEXT_PUBLIC_FIREBASE_APP_ID: <+secrets.getValue("NEXT_PUBLIC_FIREBASE_APP_ID")>
                      NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: <+secrets.getValue("NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY")>
                    command: npm --prefix frontend run build
        advanced:
          sendGitStatus:
            enabled: true
            name: Spartan SDD Quality Gate
  notificationRules:
    - name: Slack on failure
      identifier: slack_on_failure
      pipelineEvents:
        - type: PipelineFailed
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          userGroups: []
          webhookUrl: <+secrets.getValue("slack_deploys_webhook")>
      enabled: true
    - name: Email on SDD score regression
      identifier: email_on_sdd_regression
      pipelineEvents:
        - type: PipelineFailed
      notificationMethod:
        type: Email
        spec:
          userGroups: []
          recipients:
            - <+secrets.getValue("owner_email")>
      enabled: true
