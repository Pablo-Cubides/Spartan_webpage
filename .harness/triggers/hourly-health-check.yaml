# =====================================================================
# Hourly Health Check Trigger
# =====================================================================
# Runs scripts/smoke-tests.js against production every hour. Two
# consecutive failures produce a Slack/PagerDuty alert.
#
# Note: this YAML describes the Trigger that should be created in the
# Harness UI on a separate "spartan-prod-monitoring" pipeline. The
# pipeline itself is a single-stage CI pipeline that runs smoke tests.
# =====================================================================

trigger:
  name: Hourly Health Check
  identifier: hourly_health_check
  enabled: true
  description: Runs smoke tests against production every hour
  tags:
    type: monitoring
    target: production
  source:
    type: Scheduled
    spec:
      type: Cron
      spec:
        expression: "0 * * * *"   # every hour, on the hour
  pipelineIdentifier: spartan_prod_monitoring
  inputYaml: |
    pipeline:
      identifier: spartan_prod_monitoring
      variables:
        - name: target_url
          type: String
          value: https://spartan-club.vercel.app

