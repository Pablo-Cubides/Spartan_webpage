# =====================================================================
# GitHub Actions — Lightweight Fast Feedback
# =====================================================================
# This workflow is the FAST FEEDBACK path:
#   - Runs in ~2 min on every PR
#   - Covers: lint, typecheck, unit tests
#   - Useful for fork PRs / contributors without Harness access
#
# The AUTHORITATIVE QUALITY GATE is in .harness/pipelines/:
#   - SDD spec validation (structure, traceability, completeness, artifacts, verifier)
#   - Security: gitleaks (full history), OWASP Dependency-Check, npm audit
#   - Build with full env (Firebase, MercadoPago)
#   - Production approval stage
#
# See: docs/runbooks/harness-setup.md for the full Harness setup.
# =====================================================================

name: CI Fast Feedback

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  WORKING_DIR: ./frontend
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}

jobs:
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Run ESLint
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run lint

  typecheck:
    name: 🔷 TypeScript
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Generate Prisma Client
        working-directory: ${{ env.WORKING_DIR }}
        run: npx prisma generate
      - name: Run TypeScript check
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run type-check

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Generate Prisma Client
        working-directory: ${{ env.WORKING_DIR }}
        run: npx prisma generate
      - name: Run Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run test
        env:
          NODE_ENV: test

  fast-feedback-summary:
    name: ✅ Fast Feedback Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Summary
        run: |
          echo "## ✅ Fast Feedback Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Lint, typecheck, and tests succeeded." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** the authoritative quality gate (SDD, security, build) runs in Harness." >> $GITHUB_STEP_SUMMARY
          echo "See \`docs/runbooks/harness-setup.md\` for details." >> $GITHUB_STEP_SUMMARY
