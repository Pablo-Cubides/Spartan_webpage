name: Supabase Keep Alive

on:
  schedule:
    # Run twice daily (04:15 and 16:15 UTC) to maintain Supabase activity and tolerate runner delays
    - cron: '15 4,16 * * *'
  # Run manually from Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Ping Supabase Data API (PostgREST) + Auth API natively using Node 24 fetch.
      # Zero npm dependencies needed, preventing npm hang/timeouts.
      - name: Ping Supabase (PostgREST & Postgres)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/supabase-keepalive.js
